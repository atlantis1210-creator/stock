  if(v==null||v==='')return null;

    if(t===0){warn.unknown[r[1]]=(warn.unknown[r[1]]||0)+1;return;}
    const d=r[4],q=Number(r[7]),u=Number(r[8])||0;let ld,md;
    if(t===1){ld=d??S.open;md=S.open;}else{if(d==null){warn.nodate++;return;}ld=md=d;}

    rows.push({i,br,t,cr:isCredit(r[9]),sup:String(r[2]??'').trim(),code,item:String(r[6]??'').trim(),q,u,ld,md,key:br+'|'+code});
  });

function runFifo(rows,until,avg){

  for(const r of rows){

    else if(r.t>=2&&r.t<=7&&r.md<=until){let a=OB.get(r.key);if(!a){a=[];OB.set(r.key,a)}a.push(r)}
  }

    const Z=ls.length?ls[ls.length-1].cumE:0;
    let AA=0;const code=key.slice(key.indexOf('|')+1),ka=avg.key.get(key),ca=avg.code.get(code);
    if(Z>0&&ka&&ka.q>0)AA=ka.v/ka.q;else if(ca&&ca.q>0)AA=ca.v/ca.q;

    for(const r of evs){
      const sgn=r.t===3?-r.q:r.q,Y=r6(X+sgn);

function makeInv(snap,rep,names,YG){

function compute(){
  if(!DIRTY&&CACHE)return CACHE;

  // all-time average cost fallbacks
  const avg={key:new Map(),code:new Map()};
  for(const r of rows)if(r.t===1||r.t===4||r.t===6){for(const [m,k] of [[avg.key,r.key],[avg.code,r.code]]){const a=m.get(k)||{q:0,v:0};a.q+=r.q;a.v+=r.q*r.u;m.set(k,a)}}

  const mk=()=>({s:0,c:0,o:0,q:0}),brAgg=new Map(),brM=new Map(),itAgg=new Map(),caAgg=new Map(),caM=new Map();
  const get=(m,k,f)=>{let v=m.get(k);if(!v){v=f();m.set(k,v)}return v};

    else if(r.t===8)o=r.q*r.u;

    if(r.t!==8){
      const it=get(itAgg,r.key,()=>({br:r.br,code:r.code,item:names.get(r.key)||r.item,s:0,c:0,o:0,q:0}));add(it);

    if(yy===Y)get(expM,br,()=>Array(12).fill(0))[mm-1]+=amt}

  for(const[k,a]of itAgg){const x=ensure(k);x.s=a.s;x.c=a.c;x.q=a.q;x.item=a.item||x.item}

  }

  const cm=new Map();

  // ---- detail

    exp=[['الصنف','الكود','التصنيف','الفرع','المورد','المجموعة','تاريخ الشحنة','العمر (يوم)','الكمية','تكلفة الوحدة','القيمة','المستوى'],...arr.map(l=>[l.item||l.code,l.code,l.cat,l.br,l.sup,l.grp,toISO(l.ld),l.age,l.q,l.u,l.val,l.risk])];
    var more=arr.length>sh.length?arr.length-sh.length:0;
  }else{

      v.q+=l.q;v.t+=l.val;v.w+=l.age*l.val;v.old=Math.max(v.old,l.age);v.bv[l.band]+=l.val;if(l.risk==='خطر')v.d+=l.val;v.n++;v.rk[l.risk]=1}

    head=`<thead><tr class="g"><th rowspan="2" style="text-align:start">الصنف</th><th rowspan="2">الفرع</th><th rowspan="2">الكمية</th><th rowspan="2">متوسط التكلفة</th><th rowspan="2">القيمة</th><th colspan="4" class="gs">القيمة حسب العمر</th><th rowspan="2" class="gs">أقدم عمر</th><th rowspan="2">متوسط العمر</th><th rowspan="2">الحالة</th></tr><tr class="s">${BL.map((l,i)=>`<th class="${i?'':'gs'}">${l}</th>`).join('')}</tr></thead>`;
    rowsH=sh.map(x=>`<tr><td style="white-space:normal;min-width:170px">${esc(x.item)}<br><small style="color:var(--muted)">كود ${esc(x.code)} · ${esc(x.cat)}</small></td><td>${esc(x.br)}</td><td class="num">${N(x.q,x.q%1?2:0)}</td><td class="num">${N(x.q?x.t/x.q:0,2)}</td><td class="num"><b>${N(x.t)}</b></td>${x.bv.map((v,i)=>`<td class="num ${i?'':'gs'}">${v?(i===3?`<span class="pill bad"><span class="n">${F(v)}</span></span>`:N(v)):'—'}</td>`).join('')}<td class="num gs">${N(x.old)}</td><td class="num mu">${N(x.w)}</td><td><span class="chip" style="--c:${RISK_COLOR[x.top]}">${esc(x.top)}</span></td></tr>`).join('');
    exp=[['الصنف','الكود','التصنيف','الفرع','الكمية','متوسط التكلفة','القيمة',...BL.map(l=>'قيمة '+l),'أقدم عمر','متوسط العمر','الحالة'],...arr.map(x=>[x.item,x.code,x.cat,x.br,x.q,x.q?x.t/x.q:0,x.t,...x.bv,x.old,x.w,x.top])];

function catOpts(C){const set=new Set();for(const x of C.itemList)set.add(x.cat);for(const a of C.caAgg.values())set.add(a.cat);return[['*','كل التصنيفات'],...[...set].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ar')).map(c=>[c,c])]}
function filterBar(C,withText){const u=U();return`<div class="row" style="margin-top:10px">${withText?`<label style="flex:1 1 160px">بحث<input type="search" id="q" data-k="q" placeholder="${u.tab==='cats'?'اسم التصنيف':'اسم الصنف أو الكود'}" value="${esc(u.q)}"></label>`:''}<label style="flex:1 1 140px">التصنيف${sel('catf',catOpts(C),u.cat,'cat')}</label></div>`}
function viewProfit(C){
  const u=U(),S=state.s,Y=C.Y;
  const brs=C.branches.filter(b=>matchBr(C,b));
  const cf=u.cat&&u.cat!=='*'?u.cat:null;
  const g=cf?(b)=>{let s=0,c=0;for(const a of C.caAgg.values())if(a.br===b&&a.cat===cf){s+=a.s;c+=a.c}return{s,c,o:0}}:(b)=>C.brAgg.get(b)||{s:0,c:0,o:0};
  const T=brs.reduce((t,b)=>{const a=g(b);t.s+=a.s;t.c+=a.c;t.o+=a.o;return t},{s:0,c:0,o:0});
  const totalAll=T.s-T.c+T.o;
  const rowsT=brs.map(b=>{const a=g(b),gp=a.s-a.c;return`<tr><td>${esc(b)}</td><td class="num">${N(a.s)}</td><td class="num">${N(a.c)}</td><td class="num">${N(gp,0,1)}</td><td class="num">${PC(a.s?gp/a.s:0,1)}</td><td class="num">${N(a.o)}</td><td class="num"><b>${N(gp+a.o,0,1)}</b></td><td class="num">${PC(totalAll?(gp+a.o)/totalAll:0)}</td></tr>`}).join('');
  const msFor=cf?(b=>{const r=Array.from({length:12},()=>({s:0,c:0,o:0})),ms=C.caM.get(b+'\t'+cf);if(ms)ms.forEach((m,i)=>{r[i].s=m.s;r[i].c=m.c});return r}):(b=>C.brM.get(b)||Array.from({length:12},()=>({s:0,c:0,o:0})));
  const val=(m,met)=>met==='sales'?m.s:met==='cogs'?m.c:met==='oth'?m.o:met==='gpo'?m.s-m.c+m.o:met==='mg'?(m.s?(m.s-m.c)/m.s:0):m.s-m.c;
  const met=u.metric,ml={gp:'مجمل الربح',sales:'المبيعات',cogs:'التكلفة',oth:'إيرادات أخرى',gpo:'إجمالي الربح',mg:'الهامش %'}[met];
  const totM=Array.from({length:12},(_,i)=>brs.reduce((t,b)=>{const m=msFor(b)[i];t.s+=m.s;t.c+=m.c;t.o+=m.o;return t},{s:0,c:0,o:0}));
  const chartV=totM.map(m=>val(m,met));
  const fm=v=>met==='mg'?PC(v,1):N(v,0,1);
  const mrows=brs.map(b=>{const ms=msFor(b),tot=ms.reduce((t,m)=>({s:t.s+m.s,c:t.c+m.c,o:t.o+m.o}),{s:0,c:0,o:0});return`<tr><td>${esc(b)}</td>${ms.map(m=>`<td class="num">${fm(val(m,met))}</td>`).join('')}<td class="num"><b>${fm(val(tot,met))}</b></td></tr>`}).join('');
  const grand=totM.reduce((t,m)=>({s:t.s+m.s,c:t.c+m.c,o:t.o+m.o}),{s:0,c:0,o:0});
  const yrs=[];for(let y=ymd(C.from)[0];y<=ymd(C.to)[0];y++)yrs.push([y,y]);if(!yrs.length)yrs.push([Y,Y]);
  return`<div class="stack">
    <div class="card"><h2>فترة الربحية</h2><div class="row"><label>من<input type="date" id="from" data-k="from" data-date value="${toISO(S.from)}"></label>

      <label>سنة الشهور${sel('yr',yrs,Y,'year')}</label></div>${filterBar(C,false)}${cf?`<p class="note" style="margin:8px 0 0">النتائج لتصنيف «${esc(cf)}» فقط (الإيرادات الأخرى غير مرتبطة بتصنيف فلا تظهر).</p>`:''}
      <p class="note" style="margin:8px 0 0">${S.to==null?'نهاية الفترة فارغة، فتساوي تاريخ التقرير '+toISO(S.rep)+'. ':''}${S.to!=null?`<button class="btn" data-act="clearto" style="min-height:30px;padding:3px 10px">استخدم تاريخ التقرير كنهاية</button>`:''}</p></div>

      <div class="kpi"><small>المبيعات (صافي)</small><b>${N(T.s)}</b></div><div class="kpi"><small>مجمل الربح</small><b>${N(T.s-T.c,0,1)}</b><i>هامش ${PC(T.s?(T.s-T.c)/T.s:0,1)}</i></div></div>
    <div class="card"><h2>ربحية كل فرع</h2><div class="tw"><table><thead><tr><th>الفرع</th><th class="num">المبيعات</th><th class="num">التكلفة</th><th class="num">مجمل الربح</th><th class="num">الهامش</th><th class="num">إيرادات أخرى</th><th class="num">الإجمالي</th><th class="num">النصيب</th></tr></thead><tbody>${rowsT||'<tr><td colspan="8" class="empty">لا توجد بيانات</td></tr>'}</tbody>
      <tfoot><tr><td>الإجمالي</td><td class="num">${N(T.s)}</td><td class="num">${N(T.c)}</td><td class="num">${N(T.s-T.c,0,1)}</td><td class="num">${PC(T.s?(T.s-T.c)/T.s:0,1)}</td><td class="num">${N(T.o)}</td><td class="num">${N(totalAll,0,1)}</td><td class="num">${PC(1)}</td></tr></tfoot></table></div>

      <p class="note">${ml} لكل شهر (رقم الشهر تحت العمود). المقياس يُطبّق على الجدول أدناه أيضاً.</p>${chartBars(chartV,met==='mg')}
      <div class="tw"><table><thead><tr><th>الفرع</th>${MONTHS.map((m,i)=>`<th class="num">${i+1}<br>${m}</th>`).join('')}<th class="num">الإجمالي</th></tr></thead><tbody>${mrows}</tbody>
      <tfoot><tr><td>الكل</td>${totM.map(m=>`<td class="num">${fm(val(m,met))}</td>`).join('')}<td class="num">${fm(val(grand,met))}</td></tr></tfoot></table></div></div></div>`;
}


/* ---------- income statement ---------- */
function stmtOf(C,agg,expMap){
  const a=agg||{s:0,c:0,o:0},grp=new Map();
  if(expMap)for(const[g,im]of expMap)grp.set(g,[...im.values()].reduce((t,x)=>t+x,0));
  return{s:a.s,c:a.c,o:a.o,gp:a.s-a.c,grp,ex:0,net:0};
}
function viewIncome(C){
  const u=U(),S=state.s,Y=C.Y,alloc=u.alloc==='sales';
  const brs=C.branches.filter(b=>matchBr(C,b));
  const cols=brs.map(b=>({name:b,...stmtOf(C,C.brAgg.get(b),C.expBr.get(b))}));
  const sh=C.expBr.get(SHARED),oneBr=u.branch!=='*';
  if(sh&&!oneBr){
    if(alloc&&cols.length){const tS=cols.reduce((t,c)=>t+Math.max(0,c.s),0);
      for(const c of cols){const w=tS>0?Math.max(0,c.s)/tS:1/cols.length;
        for(const[g,im]of sh){const v=[...im.values()].reduce((t,x)=>t+x,0)*w;c.grp.set(g,(c.grp.get(g)||0)+v)}}}
    else cols.push({name:'مشترك (غير موزع)',...stmtOf(C,null,sh),shared:true});
  }
  for(const c of cols){c.ex=[...c.grp.values()].reduce((t,x)=>t+x,0);c.net=c.gp+c.o-c.ex}
  const T=cols.reduce((t,c)=>{t.s+=c.s;t.c+=c.c;t.o+=c.o;t.gp+=c.gp;t.ex+=c.ex;t.net+=c.net;for(const[g,v]of c.grp)t.grp.set(g,(t.grp.get(g)||0)+v);return t},{name:'الإجمالي',s:0,c:0,o:0,gp:0,ex:0,net:0,grp:new Map()});
  const all=[...cols,T],gl=[...T.grp.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const th=all.map(c=>`<th class="num">${esc(c.name)}</th>`).join('');
  const rw=(lab,f,cls='')=>`<tr class="${cls}"><td>${lab}</td>${all.map(c=>`<td class="num">${f(c)}</td>`).join('')}</tr>`;
  const pct=(a,b)=>b?PC(a/b,1):'-';
  const rows=[
    rw('المبيعات (صافي بعد المردودات)',c=>N(c.s)),
    rw('تكلفة البضاعة المباعة',c=>N(-c.c,0,1)),
    rw('مجمل الربح',c=>N(c.gp,0,1),'tot'),
    rw('هامش مجمل الربح',c=>pct(c.gp,c.s),'sm'),
    rw('إيرادات أخرى',c=>N(c.o)),
    `<tr class="hd"><td colspan="${all.length+1}">المصروفات</td></tr>`,
    ...gl.map(g=>rw(esc(g),c=>c.grp.has(g)?N(-c.grp.get(g),0,1):'-')),
    gl.length?'':`<tr><td colspan="${all.length+1}" class="empty">لا توجد مصروفات في الفترة. أضف مصروفاتك من الأسفل أو استوردها من الملف.</td></tr>`,
    rw('إجمالي المصروفات',c=>N(-c.ex,0,1),'tot'),
    rw('صافي الربح',c=>N(c.net,0,1),'tot big'),
    rw('هامش صافي الربح',c=>pct(c.net,c.s),'sm'),
    rw('المصروفات من المبيعات',c=>pct(c.ex,c.s),'sm')
  ].join('');
  // monthly net
  const brsM=[...brs,...(sh&&!oneBr&&!alloc?[SHARED]:[])];
  const mArr=b=>{const ms=C.brM.get(b)||[],ex=C.expM.get(b)||[];return Array.from({length:12},(_,i)=>{const m=ms[i]||{s:0,c:0,o:0};return(m.s-m.c+m.o)-(ex[i]||0)})};
  let rowsM=brsM.map(b=>({b,v:mArr(b)}));
  if(sh&&!oneBr&&alloc){const shm=C.expM.get(SHARED)||[],tS=Array.from({length:12},(_,i)=>brs.reduce((t,b)=>t+Math.max(0,(C.brM.get(b)||[])[i]?.s||0),0));
    rowsM=rowsM.map(r=>({b:r.b,v:r.v.map((x,i)=>{const sv=Math.max(0,(C.brM.get(r.b)||[])[i]?.s||0),w=tS[i]>0?sv/tS[i]:1/(brs.length||1);return x-(shm[i]||0)*w})}))}
  const totMv=Array.from({length:12},(_,i)=>rowsM.reduce((t,r)=>t+r.v[i],0));
  const mrows=rowsM.map(r=>`<tr><td>${esc(r.b===SHARED?'مشترك (غير موزع)':r.b)}</td>${r.v.map(v=>`<td class="num">${N(v,0,1)}</td>`).join('')}<td class="num"><b>${N(r.v.reduce((t,x)=>t+x,0),0,1)}</b></td></tr>`).join('');
  const yrs=[];for(let y=ymd(C.from)[0];y<=ymd(C.to)[0];y++)yrs.push([y,y]);if(!yrs.length)yrs.push([Y,Y]);
  // expense detail
  const detMap=new Map();
  for(const[b,gm]of C.expBr){if(b===SHARED?oneBr:!matchBr(C,b))continue;for(const[g,im]of gm)for(const[it,v]of im){const gg=detMap.get(g)||new Map();gg.set(it,(gg.get(it)||0)+v);detMap.set(g,gg)}}
  const det=[...detMap.entries()].map(([g,im])=>({g,tot:[...im.values()].reduce((t,x)=>t+x,0),items:[...im.entries()].sort((a,b)=>b[1]-a[1])})).sort((a,b)=>b.tot-a.tot);
  const detH=det.map(d=>`<tr class="hd"><td>${esc(d.g)}</td><td class="num">${N(d.tot)}</td><td class="num">${pct(d.tot,T.s)}</td></tr>`+d.items.slice(0,15).map(([it,v])=>`<tr><td style="padding-inline-start:22px">${esc(it)}</td><td class="num">${N(v)}</td><td class="num">${pct(v,T.s)}</td></tr>`).join('')).join('');
  // expense list
  const brFilter=e=>oneBr?(!isShared(e[1])&&String(e[1]).trim()===u.branch):true;
  const lst=state.exp.map((e,i)=>({e,i})).filter(x=>x.e[0]!=null&&x.e[0]>=C.from&&x.e[0]<=C.to&&brFilter(x.e)).sort((a,b)=>b.e[0]-a.e[0]||b.i-a.i);
  const shown=lst.slice(0,u.moreExp||20);
  const li=shown.map(({e,i})=>`<div class="item" style="gap:3px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:600">${esc(e[2]||e[3])}</b><span>${N(e[4])}</span></div><div class="meta">${D(e[0])} · ${esc(isShared(e[1])?SHARED:e[1])} · ${esc(e[3]||'مصروفات أخرى')}${e[5]?' · '+esc(e[5]):''}</div><div><button class="btn danger" data-act="delexp" data-v="${i}" style="min-height:30px;padding:3px 12px">حذف</button></div></div>`).join('');
  const brChoices=[...C.branches.filter(b=>!isShared(b)),SHARED];
  const gOpts=[...new Set([...EXP_GROUPS,...state.exp.map(e=>String(e[3]||'').trim()).filter(Boolean)])];
  const defD=Math.min(C.to,Math.max(C.from,todaySerial()));
  const noExp=!state.exp.length;
  return`<div class="stack">
    <div class="card"><h2>فترة قائمة الدخل</h2><div class="row"><label>من<input type="date" id="from" data-k="from" data-date value="${toISO(S.from)}"></label>
      <label>إلى<input type="date" id="to" data-k="to" data-date value="${S.to==null?'':toISO(S.to)}"></label>
      <label>سنة الشهور${sel('yr',yrs,Y,'year')}</label></div>
      <p class="note" style="margin:8px 0 0">${S.to==null?'نهاية الفترة فارغة، فتساوي تاريخ التقرير '+toISO(S.rep)+'. ':''}الفرع يُختار من أعلى الصفحة، ويظهر كل فرع في عمود مستقل مع عمود الإجمالي.</p></div>
    <div class="kpis three"><div class="kpi"><small>مجمل الربح</small><b>${N(T.gp+T.o,0,1)}</b><i>مع الإيرادات الأخرى</i></div><div class="kpi"><small>المصروفات</small><b>${N(T.ex)}</b><i>${pct(T.ex,T.s)} من المبيعات</i></div><div class="kpi big"><small>صافي الربح</small><b>${N(T.net,0,1)}</b><i>هامش ${pct(T.net,T.s)}</i></div></div>
    <div class="card"><h2>قائمة الدخل</h2><p class="note" style="margin-top:0">من ${D(C.from)} إلى ${D(C.to)}. الأرقام بين الأقواس أو السالبة تُخصم من الربح.</p>
      ${C.expBr.has(SHARED)&&!oneBr?`<div class="seg" role="group"><button type="button" data-act="set" data-k="alloc" data-v="none" aria-pressed="${!alloc}">المشترك عمود مستقل</button><button type="button" data-act="set" data-k="alloc" data-v="sales" aria-pressed="${alloc}">توزيع المشترك بنسبة المبيعات</button></div>`:''}
      ${noExp?'<div class="banner" style="margin-top:8px">لم تُدخل مصروفات بعد، فصافي الربح يساوي مجمل الربح مع الإيرادات الأخرى.</div>':''}
      <div class="tw" style="margin-top:8px"><table class="is"><thead><tr><th>البند</th>${th}</tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h2>صافي الربح الشهري — ${Y}</h2><p class="note" style="margin-top:0">مجمل الربح + الإيرادات الأخرى − المصروفات، لكل شهر (رقم الشهر تحت العمود).</p>${chartBars(totMv)}
      <div class="tw"><table><thead><tr><th>الفرع</th>${MONTHS.map((m,i)=>`<th class="num">${i+1}<br>${m}</th>`).join('')}<th class="num">الإجمالي</th></tr></thead><tbody>${mrows}</tbody>
      <tfoot><tr><td>الكل</td>${totMv.map(v=>`<td class="num">${N(v,0,1)}</td>`).join('')}<td class="num">${N(totMv.reduce((t,x)=>t+x,0),0,1)}</td></tr></tfoot></table></div></div>
    <div class="card"><h2>تفاصيل المصروفات</h2>${det.length?`<div class="tw"><table><thead><tr><th>البند</th><th class="num">المبلغ</th><th class="num">من المبيعات</th></tr></thead><tbody>${detH}</tbody></table></div>`:'<div class="empty">لا توجد مصروفات في الفترة</div>'}</div>
    <div class="card"><h2>إضافة مصروف</h2>
      <div class="row"><label>التاريخ<input type="date" id="x_d" value="${toISO(defD)}"></label><label>الفرع<select id="x_b">${brChoices.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label></div>
      <div class="row" style="margin-top:8px"><label>المجموعة<input type="text" id="x_g" list="x_gl" placeholder="مثل: إيجارات"><datalist id="x_gl">${gOpts.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label><label>البند<input type="text" id="x_i" placeholder="مثل: إيجار الفرع"></label></div>
      <div class="row" style="margin-top:8px"><label>المبلغ<input type="number" id="x_a" inputmode="decimal" min="0" step="any"></label><label style="flex:2 1 160px">ملاحظة<input type="text" id="x_n"></label></div>
      <p class="note" style="margin:8px 0">اختر «${SHARED}» لمصروف لا يخص فرعاً بعينه (إدارة، تسويق عام)، ثم وزّعه على الفروع من أعلى قائمة الدخل إن أردت.</p>
      <button class="btn primary" data-act="addexp">إضافة</button>
      <span id="x_m" class="note" style="margin-inline-start:10px"></span>
      <h2 style="margin-top:16px">مصروفات الفترة (${N(lst.length)})</h2>
      <div class="list">${li||'<div class="empty">لا توجد مصروفات في الفترة</div>'}</div>
      ${lst.length>shown.length?`<p style="text-align:center"><button class="btn" data-act="moreexp">عرض المزيد (${N(lst.length-shown.length)})</button></p>`:''}</div></div>`;
}


/* ---------- aging comparison ---------- */
function viewCompare(C){
  const u=U(),S=state.s;
  const B=u.cmpB??S.rep,A=u.cmpA??(B-90);
  const YGc=yearGroups(Math.max(ymd(A)[0],ymd(B)[0]));
  const ok=l=>matchBr(C,l.br)&&(u.group==='*'||l.grp===u.group);
  const la=invAt(C,A,YGc).filter(ok),lb=invAt(C,B,YGc).filter(ok);
  const sum=(a,f=()=>true)=>a.reduce((t,l)=>f(l)?t+l.val:t,0);
  const tA=sum(la),tB=sum(lb),rk=(a,r)=>sum(a,l=>l.risk===r);
  const dl=(x,bad,d=0)=>{const c=Math.abs(x)<0.5?'':((x>0)===!!bad?' neg':' pos');return`<span class="n${c}">${x>0?'+':''}${F(x,d)}</span>`};
  // delta pill: bad=true means an increase is bad
  const pill=(x,bad)=>{if(Math.abs(x)<0.5)return'<span class="pill flat">—</span>';return`<span class="pill ${(x>0)===!!bad?'bad':'good'}">${x>0?'▲':'▼'} <span class="n">${F(Math.abs(x))}</span></span>`};
  const pctChg=(a,b)=>a>0.5?`<span class="n" style="color:var(--muted)">${b>=a?'+':'−'}${(Math.abs(b-a)/a*100).toFixed(0)}%</span>`:'<span style="color:var(--muted)">—</span>';
  const bl=[`حتى ${S.b1} يوم`,`من ${S.b1+1} إلى ${S.b2} يوم`,`من ${S.b2+1} إلى ${S.b3} يوم`,...YGc.labels.map(l=>`أكثر من ${S.b3} يوم — ${l}`)];
  const bi=l=>l.band<3?l.band:3+l.yg;
  const bandRiskOf=i=>i<2?'صحي':i===2?'بداية الخطر':(YGc.starts[i-3]>=ymd(B)[0]-1?'بداية الخطر':'خطر');
  const bandRows=bl.map((lab,i)=>({lab,a:sum(la,l=>bi(l)===i),b:sum(lb,l=>bi(l)===i),bad:i>=2,risk:bandRiskOf(i)})).filter((x,i)=>i<3||x.a>0||x.b>0);
  const dot=c=>`<i class="dot" style="background:${c}"></i>`;
  const share=(v,t)=>t?Math.min(100,v/t*100):0;
  const bars=(x)=>`<span class="mb"><i style="width:${share(x.a,tA)}%;background:var(--muted);opacity:.55"></i></span><span class="mb"><i style="width:${share(x.b,tB)}%;background:var(--accent)"></i></span>`;
  const dA=toISO(A),dB=toISO(B);
  const distHead=(first)=>`<thead><tr class="g"><th rowspan="2" style="text-align:start">${first}</th><th colspan="2" class="gs">${dA}</th><th colspan="2" class="gs">${dB}</th><th colspan="2" class="gs">التغير</th><th rowspan="2" class="gs">النصيب من الإجمالي</th></tr><tr class="s"><th class="gs">القيمة</th><th>%</th><th class="gs">القيمة</th><th>%</th><th class="gs">الفرق</th><th>%</th></tr></thead>`;
  const distRow=x=>`<tr><td>${dot(RISK_COLOR[x.risk])}${esc(x.lab)}</td><td class="num gs">${N(x.a)}</td><td class="num mu">${PC(tA?x.a/tA:0)}</td><td class="num gs">${N(x.b)}</td><td class="num mu">${PC(tB?x.b/tB:0)}</td><td class="num gs">${pill(x.b-x.a,x.bad)}</td><td class="num">${pctChg(x.a,x.b)}</td><td class="gs" style="min-width:90px">${bars(x)}</td></tr>`;
  const distFoot=(lab)=>`<tfoot><tr><td>${lab}</td><td class="num gs">${N(tA)}</td><td class="num">${PC(tA?1:0)}</td><td class="num gs">${N(tB)}</td><td class="num">${PC(tB?1:0)}</td><td class="num gs">${pill(tB-tA,false)}</td><td class="num">${pctChg(tA,tB)}</td><td class="gs"></td></tr></tfoot>`;
  const riskRows=RISK.map(r=>({lab:r,a:rk(la,r),b:rk(lb,r),bad:r!=='صحي',risk:r}));
  // branches
  let brT='';
  if(u.branch==='*'&&C.branches.length>1){
    const bs=C.branches.map(b=>{const a=la.filter(l=>l.br===b),c=lb.filter(l=>l.br===b);return{b,ta:sum(a),tb:sum(c),da:rk(a,'خطر'),db:rk(c,'خطر')}}).filter(x=>x.ta||x.tb);
    const T=bs.reduce((t,x)=>({ta:t.ta+x.ta,tb:t.tb+x.tb,da:t.da+x.da,db:t.db+x.db}),{ta:0,tb:0,da:0,db:0});
    const row=(n,x,f)=>`<tr><td>${n}</td><td class="num gs">${N(x.ta)}</td><td class="num">${N(x.tb)}</td><td class="num">${pill(x.tb-x.ta,false)}</td><td class="num gs">${N(x.da)}</td><td class="num">${N(x.db)}</td><td class="num">${pill(x.db-x.da,true)}</td><td class="num gs">${PC(x.ta?x.da/x.ta:0)}</td><td class="num">${PC(x.tb?x.db/x.tb:0)}</td></tr>`;
    brT=`<div class="card"><h2>المقارنة حسب الفرع</h2><div class="tw"><table class="ct"><thead><tr class="g"><th rowspan="2" style="text-align:start">الفرع</th><th colspan="3" class="gs">إجمالي المخزون</th><th colspan="3" class="gs">منه خطر (راكد)</th><th colspan="2" class="gs">% الخطر</th></tr><tr class="s"><th class="gs">${dA}</th><th>${dB}</th><th>التغير</th><th class="gs">${dA}</th><th>${dB}</th><th>التغير</th><th class="gs">${dA}</th><th>${dB}</th></tr></thead><tbody>${bs.map(x=>row(esc(x.b),x)).join('')}</tbody><tfoot>${row('الإجمالي',T)}</tfoot></table></div></div>`;
  }
  // categories
  const cm=new Map(),cg=(c)=>{let v=cm.get(c);if(!v){v={c,a:0,b:0,da:0,db:0};cm.set(c,v)}return v};
  for(const l of la){const v=cg(l.cat);v.a+=l.val;if(l.risk==='خطر')v.da+=l.val}
  for(const l of lb){const v=cg(l.cat);v.b+=l.val;if(l.risk==='خطر')v.db+=l.val}
  const cats=[...cm.values()].sort((x,y)=>Math.abs(y.b-y.a)-Math.abs(x.b-x.a)).slice(0,12);
  const im=new Map(),ig=(l)=>{let v=im.get(l.key);if(!v){v={br:l.br,code:l.code,item:l.item,a:0,b:0};im.set(l.key,v)}return v};
  for(const l of la)if(l.risk==='خطر')ig(l).a+=l.val;
  for(const l of lb)if(l.risk==='خطر')ig(l).b+=l.val;
  const its=[...im.values()].map(x=>({...x,d:x.b-x.a}));
  const worse=its.filter(x=>x.d>0.5).sort((x,y)=>y.d-x.d).slice(0,10),better=its.filter(x=>x.d<-0.5).sort((x,y)=>x.d-y.d).slice(0,10);
  const itT=(arr,bad)=>arr.length?`<div class="tw"><table class="ct"><thead><tr class="g"><th style="text-align:start">الصنف</th><th>الفرع</th><th>${dA}</th><th>${dB}</th><th>التغير</th></tr></thead><tbody>${arr.map(x=>`<tr><td style="white-space:normal;min-width:150px">${esc(x.item||x.code)}</td><td>${esc(x.br)}</td><td class="num">${N(x.a)}</td><td class="num">${N(x.b)}</td><td class="num">${pill(x.d,bad)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا يوجد</div>';
  return`<div class="stack">
    <div class="card"><h2>مقارنة أعمار المخزون بين تاريخين</h2>
      <div class="row"><label>التاريخ الأول<input type="date" id="cmpA" data-k="cmpA" data-date value="${dA}"></label><label>التاريخ الثاني<input type="date" id="cmpB" data-k="cmpB" data-date value="${dB}"></label>
      <label>المجموعة${sel('grp',[['*','الكل'],...GROUPS.map(g=>[g,g])],u.group,'group')}</label></div>
      <p class="note" style="margin:8px 0 0">الفرع يُختار من أعلى الصفحة (أو كل الفروع). المخزون في كل تاريخ يُحسب بالوارد أولاً يصرف أولاً بكل الحركات حتى ذلك التاريخ.</p></div>
    <div class="kpis three"><div class="kpi"><small>المخزون في ${dA}</small><b>${N(tA)}</b></div><div class="kpi"><small>المخزون في ${dB}</small><b>${N(tB)}</b></div><div class="kpi big"><small>التغير</small><b>${dl(tB-tA,false)}</b><i>${tA?dl((tB-tA)/tA*100,false,1)+'%':'-'}</i></div></div>
    <div class="kpis three"><div class="kpi"><small style="color:var(--c5)">خطر (قبل)</small><b>${N(rk(la,'خطر'))}</b><i>${PC(tA?rk(la,'خطر')/tA:0)}</i></div><div class="kpi"><small style="color:var(--c5)">خطر (بعد)</small><b>${N(rk(lb,'خطر'))}</b><i>${PC(tB?rk(lb,'خطر')/tB:0)}</i></div><div class="kpi"><small>تغير الخطر</small><b>${dl(rk(lb,'خطر')-rk(la,'خطر'),true)}</b></div></div>
    <div class="card"><h2>توزيع الأعمار</h2><div class="tw"><table class="ct">${distHead('فئة العمر')}<tbody>${bandRows.map(distRow).join('')}</tbody>${distFoot('الإجمالي')}</table></div>
      <p class="legend"><span><i class="mb2" style="background:var(--muted);opacity:.55"></i>${dA}</span><span><i class="mb2" style="background:var(--accent)"></i>${dB}</span><span><span class="pill good">▼</span> تغير جيد</span><span><span class="pill bad">▲</span> تغير سيئ</span></p>

/* ---------- daily sheet ---------- */
function viewDaily(C){
  const u=U(),one=u.branch!=='*',brs=one?[u.branch]:[...C.branches,...(C.expBr.has(SHARED)?[SHARED]:[])];
  const mvDays=C.rows.filter(r=>r.t>=2&&r.t!==1).map(r=>r.md);
  const day=u.day??(mvDays.length?Math.max(...mvDays):C.rep);
  // daily net cash per branch (cash transactions only)
  const nets=new Map(),add=(b,d,v)=>{let m=nets.get(b);if(!m){m=new Map();nets.set(b,m)}m.set(d,(m.get(d)||0)+v)};
  for(const r of C.rows){if(!brs.includes(r.br)||r.cr)continue;const v=r.q*r.u;
    if(r.t===2||r.t===8||r.t===5)add(r.br,r.md,v);else if(r.t===3||r.t===4)add(r.br,r.md,-v)}
  const payB=e=>isShared(e[1])?SHARED:String(e[1]).trim();
  for(const e of state.pay){const pk=payKind(e[2]);if(!pk||pk.cls==='open'||e[0]==null||!brs.includes(payB(e)))continue;add(payB(e),e[0],pk.k==='AR'?(Number(e[4])||0):-(Number(e[4])||0))}
  for(const e of state.exp){const b=isShared(e[1])?SHARED:String(e[1]).trim();if(!brs.includes(b)||e[0]==null)continue;add(b,e[0],-(Number(e[4])||0))}
  const opening=D0=>brs.reduce((t,b)=>{const c=state.cash[b],a0=c?Number(c.a)||0:0,d0=c&&c.d!=null?c.d:-1e9;if(D0<=d0)return t+a0;let x=a0;for(const[d,v]of(nets.get(b)||[]))if(d>=d0&&d<D0)x+=v;return t+x},0);
  const open=opening(day);
  // day items
  const sales=[],cat=new Map(),pur=new Map(),prn=new Map(),crPur=new Map(),crPrn=new Map();let crS=0;
  for(const r of C.rows){if(!brs.includes(r.br)||r.md!==day)continue;
    if(r.t===2||r.t===3||r.t===8){const sg=r.t===3?-1:1,v=sg*r.q*r.u;sales.push({name:(r.item||r.code)+(r.t===3?' (مردود)':'')+(r.cr?' · آجل — '+(r.sup||'عميل'):''),q:sg*r.q,u:r.u,v});const c=r.t===8?'إيرادات أخرى':catOf(r.code);cat.set(c,(cat.get(c)||0)+v);if(r.cr)crS+=v}
    else if(r.t===4||r.t===5){const doc=String(state.ledger[r.i][3]??'').trim(),m=r.cr?(r.t===4?crPur:crPrn):(r.t===4?pur:prn),k=(r.sup||'مورد')+'\t'+doc;m.set(k,(m.get(k)||0)+r.q*r.u)}}
  const exs=state.exp.filter(e=>e[0]===day&&brs.includes(isShared(e[1])?SHARED:String(e[1]).trim()));
  const rcp=[],pys=[];for(const e of state.pay){const pk=payKind(e[2]);if(!pk||pk.cls!=='pay'||e[0]!==day||!brs.includes(payB(e)))continue;(pk.k==='AR'?rcp:pys).push([String(e[3]||'').trim()||'بدون اسم',Number(e[4])||0])}
  const rev=sales.reduce((t,x)=>t+x.v,0),exT=exs.reduce((t,e)=>t+(Number(e[4])||0),0),puT=[...pur.values()].reduce((t,x)=>t+x,0),prT=[...prn.values()].reduce((t,x)=>t+x,0);
  const rcT=rcp.reduce((t,x)=>t+x[1],0),pyT=pys.reduce((t,x)=>t+x[1],0);
  const close=open+rev-crS-exT-puT+prT+rcT-pyT;
  const lab=k=>{const[s,d]=k.split('\t');return s+(d?' · فاتورة '+d:'')};
  const catArr=[...cat].sort((a,b)=>b[1]-a[1]);
  const L=[],pu=(l,v,cls='')=>L.push({l,v,cls});
  pu('رصيد أول اليوم (خزينة)',open,'sum');pu('إجمالي الإيراد اليومي',rev,'sum');
  if(Math.abs(crS)>1e-9)pu('يخصم: مبيعات آجلة (على حساب العملاء)',-crS);
  rcp.forEach(([n,v])=>pu('تحصيل من عميل '+n,v));
  exs.forEach(e=>pu((e[2]||e[3])+(isShared(e[1])&&!one?' (مشترك)':''),-(Number(e[4])||0)));
  [...pur].forEach(([k,v])=>pu('مدفوعات مورد '+lab(k)+' - مشتريات بغرض البيع',-v,'pay'));
  pys.forEach(([n,v])=>pu('سداد للمورد '+n,-v,'pay'));
  [...prn].forEach(([k,v])=>pu('مردود مشتريات '+lab(k),v));
  [...crPur].forEach(([k,v])=>pu('مشتريات آجلة من '+lab(k)+' (لا تؤثر على الخزينة)',v,'memo'));
  [...crPrn].forEach(([k,v])=>pu('مردود مشتريات آجل من '+lab(k)+' (لا يؤثر على الخزينة)',v,'memo'));
  pu('رصيد آخر اليوم (النقدية المتوفرة)',close,'fin');
  const R=(a,b,cls='')=>`<tr class="${cls}"><td>${a}</td><td class="num">${b}</td></tr>`;
  const sumRows=L.map(x=>x.cls==='sum'||x.cls==='fin'?R(esc(x.l),N(x.v),x.cls):x.cls==='memo'?R(esc(x.l),'('+N(x.v)+')','memo'):R(esc(x.l),(x.v<0?'- ':'+ ')+N(Math.abs(x.v)),x.cls)).join('');
  const salesRows=sales.map((x,i)=>`<tr><td class="num" style="text-align:center">${i+1}</td><td>${esc(x.name)}</td><td class="num" style="text-align:center">${N(x.q,x.q%1?2:0)}</td><td class="num">${N(x.u,2)}</td><td class="num">${N(x.v,2)}</td></tr>`).join('');
  const cashRows=brs.filter(b=>!(b===SHARED&&brs.length>1&&false)).map((b,i)=>{const c=state.cash[b]||{};return`<div class="row" style="margin-top:8px;align-items:end"><span style="flex:1 1 100%;font-weight:600">${esc(b===SHARED?'مشترك (مصروفات الإدارة)':b)}</span><label>من تاريخ<input type="date" data-cashb="${esc(b)}" data-cf="d" value="${c.d!=null?toISO(c.d):''}"></label><label>رصيد الخزينة أول ذلك اليوم<input type="number" inputmode="decimal" step="any" data-cashb="${esc(b)}" data-cf="a" value="${c.a!=null?c.a:''}"></label></div>`}).join('');
  window.DAILY={day,branch:one?u.branch:'كل الفروع',open,rev,close,sum:L.map(x=>[x.l,x.v]),sales:sales.map((x,i)=>[i+1,x.name,x.q,x.u,x.v]),cats:catArr};
  return`<div class="stack">
    <div class="card noprint"><h2>الورقة اليومية</h2><div class="dd"><button class="btn" data-act="dayshift" data-v="1" aria-label="اليوم التالي">›</button><input type="date" id="dd" data-k="day" data-date value="${toISO(day)}"><button class="btn" data-act="dayshift" data-v="-1" aria-label="اليوم السابق">‹</button></div>
      <p class="note" style="margin:8px 0 0">اختر الفرع من أعلى الصفحة (أو كل الفروع) والتاريخ. رصيد أول اليوم = رصيد الخزينة المدخل + صافي كل الأيام السابقة تلقائياً. تؤثر على الخزينة المعاملات النقدية فقط (المبيعات والمشتريات ومردوداتها) مع التحصيل من العملاء والسداد للموردين والمصروفات. المعاملات الآجلة تظهر ولا تدخل الخزينة.</p></div>
    <div class="dtitle">الإيراد اليومي ${toISO(day)}</div><div class="dbr">${esc(one?u.branch:'كل الفروع')}</div>
    <div class="cmpv">
      <div class="tw" style="grid-column:1/-1"><table class="dt"><thead><tr><th>الخلاصة</th><th style="width:110px">الإجمالي</th></tr></thead><tbody>${sumRows}</tbody></table></div>
    </div>
    <div class="tw"><table class="dt"><thead><tr><th style="width:34px">م</th><th>المنتج</th><th style="width:56px">الكمية</th><th style="width:78px">سعر الوحدة</th><th style="width:86px">الإجمالي</th></tr></thead><tbody>${salesRows||'<tr><td colspan="5" class="empty">لا توجد مبيعات في هذا اليوم</td></tr>'}</tbody>
      <tfoot><tr class="fin"><td colspan="4" style="text-align:center">إجمالي الإيراد اليومي</td><td class="num">${N(rev,2)}</td></tr></tfoot></table></div>

      <tfoot><tr class="sum"><td>الإجمالي حسب التصنيف</td><td class="num">${N(rev,2)}</td><td></td></tr></tfoot></table></div>
    <div class="card noprint"><h2>رصيد الخزينة</h2><p class="note" style="margin:0">اكتب رصيد الخزينة في بداية يوم محدد لكل فرع، والبرنامج يرحّل الرصيد يوماً بيوم.</p>${cashRows}</div>

}


/* ---------- item ledger (كشف حساب صنف) ---------- */
function viewLedger(C){
  const u=U(),S=state.s,q=normTxt(u.lq||'');
  // code index
  const idx=new Map();
  for(const r of state.ledger){const c=String(r[5]??'').trim();if(!c)continue;const e=idx.get(c)||{code:c,name:'',n:0};if(String(r[6]??'').trim())e.name=String(r[6]).trim();e.n++;idx.set(c,e)}
  const all=[...idx.values()];
  let matches=[];
  if(q){const ex=all.filter(e=>normTxt(e.code)===q);
    matches=ex.length?ex:all.filter(e=>normTxt(e.code+e.name+catOf(e.code)).includes(q));}
  let sel1=u.lcode&&idx.has(u.lcode)?u.lcode:null;
  if(q&&matches.length===1)sel1=matches[0].code;
  if(q&&sel1&&!matches.some(m=>m.code===sel1))sel1=null;
  const chips=q&&matches.length>1?`<div class="cgrid" style="margin-top:10px">${matches.slice(0,30).map(m=>`<button class="chipbtn" data-act="lsel" data-v="${esc(m.code)}" aria-pressed="${m.code===sel1}"><b>${esc(m.name||m.code)}</b><small>كود ${esc(m.code)} · ${esc(catOf(m.code))}</small></button>`).join('')}</div><p class="note">${matches.length>30?'أول 30 من '+matches.length+' نتيجة. ':''}اختر الصنف المطلوب.</p>`:'';
  let body='';
  if(!q)body='<div class="card"><div class="empty">اكتب اسم الصنف أو كوده في الخانة بالأعلى لعرض كشف حسابه.</div></div>';
  else if(!matches.length)body='<div class="card"><div class="empty">لا يوجد صنف مطابق.</div></div>';
  else if(!sel1)body='';
  else{
    const rows=[];
    state.ledger.forEach((r,i)=>{
      if(String(r[5]??'').trim()!==sel1)return;
      const br=String(r[0]??'').trim();if(u.branch!=='*'&&br!==u.branch)return;
      const t=opType(r[1]);if(t===null)return;
      const nq=Number(r[7])||0,pr=Number(r[8])||0;
      const d=t===1?(r[4]??S.open):r[4];
      rows.push({i,br,t,op:String(r[1]??'').trim(),d,doc:String(r[3]??'').trim(),sup:String(r[2]??'').trim(),q:nq,u:pr});
    });
    const sgn=t=>(t===1||t===3||t===4||t===6)?1:(t===2||t===5||t===7)?-1:0;
    const byBr=new Map();for(const r of rows){if(!byBr.has(r.br))byBr.set(r.br,[]);byBr.get(r.br).push(r)}
    const brList=[...byBr.keys()].sort();
    const nm=idx.get(sel1).name||sel1;
    const secs=brList.map(b=>{
      const arr=byBr.get(b).sort((x,y)=>(x.d==null)-(y.d==null)||(x.d-y.d)||(sgn(y.t)-sgn(x.t))||(x.i-y.i));
      let bal=0,tin=0,tout=0,sQ=0,sV=0,opn=0;
      const trs=arr.map(r=>{
        const sg=sgn(r.t),inn=sg>0?r.q:0,out=sg<0?r.q:0;bal+=sg*r.q;if(r.t===1)opn+=inn;else tin+=inn;tout+=out;
        if(r.t===2){sQ+=r.q;sV+=r.q*r.u}else if(r.t===3){sQ-=r.q;sV-=r.q*r.u}
        const desc=[r.sup,r.doc&&r.doc!=='0'&&('إذن '+r.doc)].filter(Boolean).join(' · ');
        return`<tr><td>${r.d==null?'<span class="neg">بلا تاريخ</span>':D(r.d)}</td><td>${esc(r.op)}</td><td style="white-space:normal;min-width:110px">${esc(desc)||'—'}</td><td class="num">${inn?N(inn,inn%1?2:0):''}</td><td class="num">${out?N(out,out%1?2:0):''}</td><td class="num">${N(r.u,2)}</td><td class="num"><b class="${bal<0?'neg':''}">${N(bal,bal%1?2:0)}</b></td></tr>`}).join('');
      const stock=C.inv.filter(l=>l.br===b&&l.code===sel1),sq=stock.reduce((t,l)=>t+l.q,0),sv=stock.reduce((t,l)=>t+l.val,0);
      return`<div class="card"><h2>${esc(b||'بدون فرع')}</h2>

        <div class="kpis" style="margin-top:8px"><div class="kpi big"><small>الرصيد الحالي بالدفاتر</small><b>${N(bal,bal%1?2:0)}</b></div></div>

        <div class="tw"><table><thead><tr><th>التاريخ</th><th>العملية</th><th>البيان</th><th class="num">وارد</th><th class="num">منصرف</th><th class="num">السعر / التكلفة</th><th class="num">الرصيد</th></tr></thead><tbody>${trs}</tbody></table></div></div>`}).join('');
    body=`<div class="card"><h2 style="margin-bottom:2px">${esc(nm)}</h2><div class="meta">كود ${esc(sel1)} · ${esc(catOf(sel1))} · ${N(rows.length)} حركة${u.branch!=='*'?' في فرع '+esc(u.branch):' في '+brList.length+' فرع'}</div></div>${secs||'<div class="card"><div class="empty">لا توجد حركات لهذا الصنف في الفرع المختار.</div></div>'}`;
  }
  return`<div class="stack"><div class="card"><h2>كشف حساب صنف</h2>
    <label>اسم الصنف أو الكود<input type="search" id="lq" placeholder="اكتب جزءاً من الاسم أو الكود" value="${esc(u.lq||'')}"></label>${chips}
    <p class="note" style="margin:8px 0 0">تظهر كل حركات الصنف مرتبة بالتاريخ، وكل فرع في جدول مستقل مع الرصيد بعد كل حركة. اختر فرعاً من أعلى الصفحة لعرضه وحده.</p></div>${body}</div>`;
}


/* ---------- customers & suppliers (credit accounts) ---------- */
function viewAccounts(C){
  const u=U(),S=state.s,kind=u.acck||'AR',isAR=kind==='AR',rep0=S.rep;
  const evAll=buildAcc(C).filter(e=>e.d<=rep0&&(u.branch==='*'||e.br===u.branch));
  const pk=x=>normTxt(x);
  const parties=new Map();
  for(const e of evAll){const key=pk(e.party),g=parties.get(key)||{name:e.party,AR:{o:0,i:0,r:0,p:0,last:null},AP:{o:0,i:0,r:0,p:0,last:null}};
    const t=g[e.k];if(e.cls==='open')t.o+=e.a;else if(e.cls==='inv')t.i+=e.a;else if(e.cls==='ret')t.r+=e.a;else t.p+=e.a;
    if(t.last==null||e.d>t.last)t.last=e.d;parties.set(key,g)}
  const bal=t=>t.o+t.i+t.r+t.p;
  const all=[...parties.values()];
  const totAR=all.reduce((t,g)=>t+bal(g.AR),0),totAP=all.reduce((t,g)=>t+bal(g.AP),0);
  const qn=pk(u.aq||'');
  let list=all.filter(g=>g[kind].last!=null&&(!qn||pk(g.name).includes(qn))).map(g=>({name:g.name,...g[kind],b:bal(g[kind])}));
  list.sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
  const T=list.reduce((t,x)=>({o:t.o+x.o,i:t.i+x.i,r:t.r+x.r,p:t.p+x.p,b:t.b+x.b}),{o:0,i:0,r:0,p:0,b:0});
  const L1=isAR?{inv:'مبيعات آجلة',ret:'مردودات مبيعات',pay:'تحصيلات',party:'العميل',bal:'مستحق على العميل'}:{inv:'مشتريات آجلة',ret:'مردودات مشتريات',pay:'مدفوعات',party:'المورد',bal:'مستحق للمورد'};
  const rows=list.map(x=>`<tr class="clk" data-act="party" data-v="${esc(pk(x.name))}"><td>${esc(x.name)}</td><td class="num">${x.o?N(x.o):'—'}</td><td class="num">${N(x.i)}</td><td class="num">${x.r?N(x.r,0,1):'—'}</td><td class="num">${x.p?N(x.p,0,1):'—'}</td><td class="num"><b class="${x.b<-0.5?'neg':''}">${N(x.b)}</b></td><td class="num mu">${x.last!=null?D(x.last):''}</td></tr>`).join('');
  // statement
  let stm='';const sel1=u.party&&parties.has(u.party)?parties.get(u.party):null;
  if(sel1){
    const evs=evAll.filter(e=>pk(e.party)===u.party&&e.k===kind).sort((a,b)=>a.d-b.d||(a.cls==='open'?-1:0)-(b.cls==='open'?-1:0));
    let run=0;

function viewItems(C){
  const u=U();
  const all=C.itemList.filter(x=>matchBr(C,x.br)&&x.cls!==7&&(u.cat==='*'||x.cat===u.cat));
  const clsStat=[1,2,3,4,5,6].map(k=>{const a=all.filter(x=>x.cls===k);return{k,n:a.length,gp:a.reduce((t,x)=>t+x.gp,0),rv:a.reduce((t,x)=>t+x.remV,0)}});
  let list;const q=u.q.trim().toLowerCase();
  if(u.view==='top')list=all.filter(x=>x.s!==0).sort((a,b)=>b.gp-a.gp).slice(0,15);
  else if(u.view==='bottom')list=all.filter(x=>x.s!==0).sort((a,b)=>a.gp-b.gp).slice(0,15);
  else if(u.view==='stag')list=all.filter(x=>x.cls===6).sort((a,b)=>b.remV-a.remV).slice(0,30);
  else{list=all.filter(x=>!u.cls||x.cls===u.cls);const k=u.sort;list.sort((a,b)=>k==='m'?b.m-a.m:k==='s'?b.s-a.s:k==='rv'?b.remV-a.remV:b.gp-a.gp)}
  if(q)list=list.filter(x=>(x.item+' '+x.code+' '+x.cat).toLowerCase().includes(q));
  const shown=list.slice(0,u.more);
  const cards=shown.map(x=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(x.item||x.code)}</h3><span class="chip" style="--c:var(--c${x.cls})">${esc(CLS[x.cls-1])}</span></div>
    <div class="meta">${esc(x.br)} · كود ${esc(x.code)} · ${esc(x.cat)}${x.abc!=='-'?' · فئة '+x.abc:''}</div>
    <div class="st"><div><span>الكمية المباعة</span><b>${N(x.q,x.q%1?2:0)}</b></div><div><span>المبيعات</span><b>${N(x.s)}</b></div><div><span>مجمل الربح</span><b>${N(x.gp,0,1)}</b></div><div><span>الهامش</span><b>${PC(x.m,1)}</b></div>
      <div><span>رصيد حالي</span><b>${N(x.remQ,x.remQ%1?2:0)}</b></div><div><span>قيمة الرصيد</span><b>${N(x.remV)}</b></div>${x.oldest!=null?`<div><span>عمر أقدم رصيد</span><b>${N(x.oldest)} يوم</b></div>`:''}${x.cover!=null?`<div><span>تغطية الرصيد</span><b>${N(x.cover)} يوم</b></div>`:''}</div>
    <div class="dec">${esc(CLS_DEC[x.cls-1])}</div></div>`).join('');
  const chips=clsStat.map(c=>`<button class="chipbtn" style="--c:var(--c${c.k})" data-act="cls" data-v="${c.k}" aria-pressed="${u.view==='all'&&u.cls===c.k}"><b>${esc(CLS[c.k-1])}</b><small>${N(c.n)} صنف · ربح ${N(c.gp,0,1)} · مخزون ${N(c.rv)}</small></button>`).join('');
  return`<div class="stack">
    <div class="card"><h2>ربحية الأصناف لكل فرع</h2><p class="note" style="margin-top:0">الفترة من ${D(C.from)} إلى ${D(C.to)}. الصنف يظهر مرة لكل فرع. اضغط على فئة لتصفية القائمة.</p><div class="cgrid">${chips}</div></div>
    <div class="card">${seg('view',u.view,[['all','كل الأصناف'],['top','الأفضل 15'],['bottom','الأضعف 15'],['stag','راكد بلا مبيعات']])}
      ${filterBar(C,true)}<div class="row" style="margin-top:10px">
      ${u.view==='all'?`<label>ترتيب${sel('srt',[['gp','مجمل الربح'],['m','الهامش'],['s','المبيعات'],['rv','قيمة الرصيد']],u.sort,'sort')}</label>`:''}</div>
      <p class="note">${N(list.length)} صنف${u.view==='all'&&u.cls?' في فئة «'+CLS[u.cls-1]+'» <button class="btn" data-act="cls" data-v="0" style="min-height:28px;padding:2px 10px">إلغاء</button>':''}</p>

function viewCats(C){
  const u=U(),cm=new Map(),Y=C.Y,hi=state.s.hi/100,A=state.s.A/100;
  const get=(c)=>{let v=cm.get(c);if(!v){v={cat:c,s:0,c:0,rv:0,ms:Array.from({length:12},()=>({s:0,c:0}))};cm.set(c,v)}return v};
  for(const a of C.caAgg.values())if(matchBr(C,a.br)){const v=get(a.cat);v.s+=a.s;v.c+=a.c}
  for(const[k,ms]of C.caM){const[b,c]=k.split('\t');if(!matchBr(C,b))continue;const v=get(c);ms.forEach((m,i)=>{v.ms[i].s+=m.s;v.ms[i].c+=m.c})}
  for(const l of C.inv)if(matchBr(C,l.br))get(l.cat).rv+=l.val;
  const arr=[...cm.values()].map(v=>({...v,gp:v.s-v.c,m:v.s?(v.s-v.c)/v.s:0})).sort((a,b)=>b.gp-a.gp);
  const tot=arr.reduce((t,x)=>t+x.gp,0),pos=arr.reduce((t,x)=>t+(x.gp>0?x.gp:0),0);let run=0;
  for(const x of arr){const before=pos?run/pos:0;if(x.gp>0)run+=x.gp;x.cum=x.gp>0?run/pos:null;
    x.cls=(!x.s&&!x.c)?(x.rv>0?6:7):x.gp<0?5:x.gp===0?4:before<A?(x.m>=hi?1:2):(x.m>=hi?3:4)}
  const cq=u.q.trim().toLowerCase();const vis=arr.filter(x=>x.cls!==7&&(u.cat==='*'||x.cat===u.cat)&&(!cq||String(x.cat).toLowerCase().includes(cq)));
  const cards=vis.map(x=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(x.cat)}</h3><span class="chip" style="--c:var(--c${x.cls})">${esc(CLS[x.cls-1])}</span></div>
    <div class="st"><div><span>المبيعات</span><b>${N(x.s)}</b></div><div><span>مجمل الربح</span><b>${N(x.gp,0,1)}</b></div><div><span>الهامش</span><b>${PC(x.m,1)}</b></div><div><span>نسبة من الربح</span><b>${PC(tot?x.gp/tot:0)}</b></div><div><span>تراكمي</span><b>${x.cum==null?'-':PC(x.cum)}</b></div><div><span>قيمة المخزون</span><b>${N(x.rv)}</b></div></div>
    <div class="dec">${esc(CLS_DEC[x.cls-1])}</div></div>`).join('');
  const met=u.cmetric,val=m=>met==='sales'?m.s:met==='cogs'?m.c:m.s-m.c;
  const mrows=vis.slice(0,30).map(x=>`<tr><td>${esc(x.cat)}</td>${x.ms.map(m=>`<td class="num">${N(val(m),0,met==='gp')}</td>`).join('')}</tr>`).join('');
  return`<div class="stack"><div class="card"><h2>ربحية التصنيفات</h2><p class="note" style="margin:0">من ${D(C.from)} إلى ${D(C.to)}، مرتبة من الأكثر إلى الأقل ربحاً. إجمالي مجمل الربح ${N(tot,0,1)}.</p>${filterBar(C,true)}</div>
    <div class="list">${cards||'<div class="empty">لا توجد بيانات في الفترة</div>'}</div>
    <div class="card"><h2>الشهور — ${Y}</h2>${seg('cmetric',met,[['gp','مجمل الربح'],['sales','المبيعات'],['cogs','التكلفة']])}
      <p class="note">أعلى 30 تصنيفاً. الأعمدة هي أرقام الشهور (1 = يناير).</p>
      <div class="tw"><table><thead><tr><th>التصنيف</th>${MONTHS.map((m,i)=>`<th class="num">${i+1}</th>`).join('')}</tr></thead><tbody>${mrows}</tbody></table></div></div></div>`;
}

  led:'<svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  cmp:'<svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>',
  day:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  inc:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7M9 9h2"/></svg>',
  profit:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  items:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  cats:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  data:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>'};
const TABS=[['inv','المخزون'],['cmp','مقارنة الأعمار'],['day','اليومية'],['led','كشف صنف'],['acc','العملاء والموردين'],['profit','الربحية'],['inc','قائمة الدخل'],['items','الأصناف'],['cats','التصنيفات'],['data','البيانات']];
function render(){
  const ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;
  const C=compute(),u=U();
  if(u.branch!=='*'&&!C.branches.includes(u.branch))u.branch='*';
  const body={inv:viewInventory,cmp:viewCompare,day:viewDaily,led:viewLedger,acc:viewAccounts,profit:viewProfit,inc:viewIncome,items:viewItems,cats:viewCats,data:viewData}[u.tab](C);
  const showBr=u.tab!=='data';
  document.getElementById('root').innerHTML=`<header class="top"><div class="wrap"><div class="brand"><b>أعمار المخزون والربحية</b><span>${state.sample?'بيانات تجريبية · ':''}الوارد أولاً يصرف أولاً</span></div>
    ${showBr?`<label style="display:flex;gap:6px;align-items:center;min-width:0">${sel('branch',brOpts(C),u.branch,'branch')}</label>`:''}</div></header>
    <main class="wrap">${body}</main>
    <nav class="tabs" aria-label="التقارير"><div>${TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}"${u.tab===k?' aria-current="page"':''}>${ICON[k]}<span>${l}</span></button>`).join('')}</div></nav>`;
  if(fid){const e=document.getElementById(fid);if(e){e.focus();if(pos!=null&&e.setSelectionRange&&e.type!=='number'&&e.type!=='date'){try{e.setSelectionRange(pos,pos)}catch(x){}}}}
}
function touch(){DIRTY=true;save();render()}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,u=U();
  if(a==='tab'){u.tab=v;u.more=30;u.msg=u.tab==='data'?u.msg:null;render();window.scrollTo(0,0)}
  else if(a==='set'){const k=b.dataset.k;u[k]=v;u.more=30;render()}
  else if(a==='more'){u.more+=30;render()}
  else if(a==='dayshift'){const C=compute(),mv=C.rows.filter(r=>r.t>=2).map(r=>r.md),cur=u.day??(mv.length?Math.max(...mv):C.rep);u.day=cur+Number(v);render()}
  else if(a==='xday'){exportDaily()}
  else if(a==='xinv'){exportInv()}
  else if(a==='catall'){u.catAll=!u.catAll;render()}
  else if(a==='party'){u.party=v||null;render()}
  else if(a==='delpay'){state.pay.splice(+v,1);touch()}
  else if(a==='addpay'){const g=id=>document.getElementById(id),d=toSerial(g('y_d').value),amt=Number(g('y_a').value),nm=g('y_p').value.trim(),m=g('y_m');
    if(d==null||!(amt>0)||!nm){m.textContent='اكتب التاريخ والاسم والمبلغ';m.style.color='var(--bad)';return}
    state.pay.push([d,g('y_b').value,g('y_k').value,nm,amt,g('y_n').value.trim()]);touch()}
  else if(a==='lsel'){u.lcode=v;render()}
  else if(a==='moreexp'){u.moreExp=(u.moreExp||20)+30;render()}
  else if(a==='delexp'){state.exp.splice(+v,1);touch()}
  else if(a==='addexp'){const g=id=>document.getElementById(id),d=toSerial(g('x_d').value),amt=Number(g('x_a').value),m=g('x_m');
    if(d==null||!(amt>0)){m.textContent='اكتب التاريخ والمبلغ';m.style.color='var(--bad)';return}
    state.exp.push([d,g('x_b').value,g('x_i').value.trim(),g('x_g').value.trim()||'مصروفات أخرى',amt,g('x_n').value.trim()]);touch()}
  else if(a==='cls'){u.view='all';u.cls=u.cls===+v?0:+v;u.more=30;render()}
  else if(a==='clearto'){state.s.to=null;state.s.year=null;touch()}
  else if(a==='sample'){loadSample();state.s={...DEF};u.msg={t:'تم تحميل البيانات التجريبية.'};touch()}
  else if(a==='clear'){state.pay=[];state.cash={};state.exp=[];state.ledger=[];state.codes={};state.groups={};state.sample=false;u.msg={t:'تم مسح البيانات. استورد ملفك للبدء.',bad:true};touch()}
});
document.addEventListener('change',ev=>{
  const e=ev.target,k=e.dataset&&e.dataset.k;
  if(e.id==='file'){if(e.files[0])importFile(e.files[0]);return}
  if(e.dataset&&e.dataset.cashb!==undefined){const b=e.dataset.cashb,c=state.cash[b]=state.cash[b]||{d:null,a:0};
    if(e.dataset.cf==='d')c.d=toSerial(e.value);else c.a=Number(e.value)||0;touch();return}
  if(!k)return;const u=U(),S=state.s;
  if(k==='branch'||k==='group'||k==='sort'||k==='cat'||k==='isort'){u[k]=e.value;u.more=30;render();return}
  if(k==='q')return;
  if(e.dataset.date!==undefined&&(k==='day'||k==='cmpA'||k==='cmpB')){u[k]=toSerial(e.value);render();return}
  if(e.dataset.date!==undefined){const s=toSerial(e.value);
    if(k==='to'){S.to=s;S.year=null}else if(k==='from'){S.from=s??DEF.from;S.year=null}else if(k==='rep'){S.rep=s??DEF.rep}else if(k==='open'){S.open=s??DEF.open}
    touch();return}
  if(k==='year'){S.year=+e.value;touch();return}
  if(k.startsWith('s.')){const f=k.slice(2);S[f]=f==='years'?e.value:(Number(e.value)||DEF[f]);touch()}
});
let qT;document.addEventListener('input',ev=>{const e=ev.target;if(e.id==='iq'){U().iq=e.value;U().more=30;clearTimeout(qT);qT=setTimeout(render,250)}if(e.id==='aq'){U().aq=e.value;clearTimeout(qT);qT=setTimeout(render,250)}if(e.id==='lq'){U().lq=e.value;U().lcode=null;clearTimeout(qT);qT=setTimeout(render,250)}if(e.id==='q'){U().q=e.value;U().more=30;clearTimeout(qT);qT=setTimeout(render,250)}});

/* ---------- export ---------- */
function exportInv(){
  const X=window.INVX,m=document.getElementById('xmsg');
  const say=(t,bad)=>{if(m){m.textContent=t;m.style.color=bad?'var(--bad)':'var(--good)'}};
  try{
    if(typeof XLSX==='undefined')throw new Error('مكتبة الإكسيل غير محملة');
    const ws=XLSX.utils.aoa_to_sheet(X.rows);ws['!cols']=X.rows[0].map((h,i)=>({wch:i===0?40:14}));ws['!views']=[{RTL:true}];
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'المخزون');
    XLSX.writeFile(wb,'المخزون_'+X.date+'.xlsx');say('تم إنشاء الملف');
  }catch(e){say('تعذر التصدير هنا: '+(e.message||e)+'. يعمل في التطبيق المثبّت.',true)}
}
function exportDaily(){
  const D0=window.DAILY,m=document.getElementById('xmsg');
  const say=(t,bad)=>{if(m){m.textContent=t;m.style.color=bad?'var(--bad)':'var(--good)'}};
  try{
    if(typeof XLSX==='undefined')throw new Error('مكتبة الإكسيل غير محملة');
    const a=[['الإيراد اليومي '+toISO(D0.day)],[D0.branch],[],['الخلاصة','الإجمالي'],...D0.sum,[],['م','المنتج','الكمية','سعر الوحدة','الإجمالي'],...D0.sales,['','إجمالي الإيراد اليومي','','',D0.rev],[],['التصنيف','الإجمالي','%'],...D0.cats.map(([c,v])=>[c,v,D0.rev?v/D0.rev:0]),['الإجمالي حسب التصنيف',D0.rev,'']];
    const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:44},{wch:36},{wch:10},{wch:14},{wch:14}];ws['!views']=[{RTL:true}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}},{s:{r:1,c:0},e:{r:1,c:4}}];
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'اليومية');
    XLSX.writeFile(wb,'اليومية_'+D0.branch+'_'+toISO(D0.day)+'.xlsx');
    say('تم إنشاء الملف');
  }catch(e){say('تعذر التصدير هنا: '+(e.message||e)+'. التصدير يعمل في التطبيق المثبّت على الهاتف.',true)}
}
/* ---------- import ---------- */
function rowsOf(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false})}
async function importFile(file){
  const u=U();
  try{
    if(typeof XLSX==='undefined')throw new Error('تعذر تحميل مكتبة قراءة الإكسيل. تحقق من الاتصال بالإنترنت وأعد المحاولة.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let led=null,codes=null,groups=null,exps=null,cash=null,pays=null,sheetName='';
    const names=[...wb.SheetNames].sort((a,b)=>(normTxt(b)==='الحركه')-(normTxt(a)==='الحركه'));
    for(const n of names){
      const rs=rowsOf(wb.Sheets[n]);
      if(!led){
        const hi=rs.slice(0,12).findIndex(r=>r.some(c=>normTxt(c)==='العمليه')&&r.some(c=>normTxt(c)==='الفرع'));
        if(hi>=0){const c=rs[hi].findIndex(x=>normTxt(x)==='العمليه');led=[];sheetName=n;const payCol=rs[hi].findIndex(x=>{const z=normTxt(x);return z.includes('الدفع')||z==='نقدياجل'||z==='نقديواجل'});
          for(const r of rs.slice(hi+1)){const op=r[c];if(op==null||String(op).trim()==='')continue;
            const br=String(r[c-1]??'').trim(),code=String(r[c+4]??'').trim();if(!br&&!code)continue;
            led.push([br,String(op).trim(),String(r[c+1]??'').trim(),r[c+2],parseDate(r[c+3]),code,String(r[c+5]??'').trim(),Number(r[c+6])||0,Number(r[c+7])||0,payCol>=0?String(r[payCol]??'').trim():''])}
          continue}
      }
      if(normTxt(n).includes('تحصيل')||normTxt(n).includes('السداد')){
        const hi=rs.slice(0,12).findIndex(r=>r.some(c=>normTxt(c).includes('مبلغ')));
        if(hi>=0){pays=pays||[];for(const r of rs.slice(hi+1)){const a=Number(r[4]);if(!a)continue;const d=parseDate(r[0]);if(d==null)continue;pays.push([d,String(r[1]??'').trim()||SHARED,String(r[2]??'').trim(),String(r[3]??'').trim(),a,String(r[5]??'').trim()])}}
        continue}
      if(normTxt(n)==='الخزينه'){cash=cash||{};for(const r of rs.slice(1)){const b=String(r[0]??'').trim();if(!b)continue;cash[b]={d:parseDate(r[1]),a:Number(r[2])||0}}continue}
      if(normTxt(n)==='المصروفات'){
        const hi=rs.slice(0,12).findIndex(r=>r.some(c=>normTxt(c).includes('مبلغ')||normTxt(c)==='القيمه'));
        if(hi>=0){const H=rs[hi].map(normTxt),ix=(...ks)=>H.findIndex(h=>ks.some(k=>h.includes(k)));
          const cD=ix('تاريخ'),cB=ix('فرع'),cI=ix('بند','بيان'),cG=ix('مجموع','تصنيف','نوع'),cA=ix('مبلغ','قيمه'),cN=ix('ملاحظ');
          exps=[];for(const r of rs.slice(hi+1)){const a=Number(r[cA]);if(!a)continue;const d=parseDate(r[cD]);if(d==null)continue;
            exps.push([d,String(r[cB]??'').trim()||SHARED,String(r[cI]??'').trim(),String(r[cG]??'').trim()||'مصروفات أخرى',a,cN>=0?String(r[cN]??'').trim():''])}}
        continue}
      if(normTxt(n)==='الاكواد'){codes={};for(const r of rs.slice(1)){if(r[0]==null||r[0]==='')continue;codes[String(r[0]).trim()]=String(r[2]??'').trim()||'غير مصنف'}}
      else if(normTxt(n)==='الموردين'){groups=groups||{};for(const r of rs.slice(1)){const sp=String(r[0]??'').trim(),g=String(r[1]??'').trim();if(sp&&GROUPS.includes(g))groups[sp]=g}}
      else if(normTxt(n)==='الاعدادات'){groups={};for(const r of rs.slice(4)){const s=String(r[8]??'').trim(),g=String(r[9]??'').trim();if(s&&GROUPS.includes(g))groups[s]=g}}
    }
    if(!led&&!codes&&!exps&&!cash&&!pays)throw new Error('لم أجد ورقة حركة بأعمدة «الفرع» و«العملية» ولا ورقة «المصروفات». تأكد أن الصف الأول يحمل عناوين ملف 2026.');
    if(state.sample&&led){state.ledger=[];state.codes={};state.groups={}}
    if(state.sample&&(led||exps||pays)){state.exp=[];state.pay=[]}
    if(cash)state.cash=u.mode==='append'?{...state.cash,...cash}:cash;
    if(pays)state.pay=u.mode==='append'?state.pay.concat(pays):pays;
    if(exps)state.exp=u.mode==='append'?state.exp.concat(exps):exps;
    if(led){state.ledger=u.mode==='append'?state.ledger.concat(led):led;}
    if(codes)state.codes=u.mode==='append'?{...state.codes,...codes}:codes;
    if(groups)state.groups=u.mode==='append'?{...state.groups,...groups}:groups;
    if(led){state.sample=false;const all=state.ledger.map(r=>r[4]).filter(x=>x!=null),op=state.ledger.filter(r=>opType(r[1])!==1).map(r=>r[4]).filter(x=>x!=null),ds=all;if(ds.length){const mx=Math.max(...ds),mn=Math.min(...(op.length?op:all));
      state.s.open=toSerial(ymd(mn)[0]+'-01-01');state.s.from=state.s.open;state.s.to=null;state.s.year=null;state.s.rep=Math.max(todaySerial(),mx);}}
    u.msg={t:`تم الاستيراد: ${led?led.length+' حركة من ورقة «'+sheetName+'»':'بدون حركة'}${codes?'، '+Object.keys(codes).length+' كود':''}${groups?'، '+Object.keys(groups).length+' مورد':''}${exps?'، '+exps.length+' مصروف':''}${pays?'، '+pays.length+' تحصيل/سداد':''}. راجع فحص الجودة أدناه.`};
  }catch(e){u.msg={t:'تعذر الاستيراد: '+(e.message||e),bad:true}}
  touch();
}

load();render();
</script>
